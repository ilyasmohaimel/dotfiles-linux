[general]
working_directory = "/home/lookfrost"
import = ["~/.config/alacritty/activity-colors.toml"]

[terminal.shell]
program = "/usr/bin/fish"
args = ["--login"]

[window]
opacity = 0.4
blur = true
padding = { x = 15, y = 15 }
decorations = "None"

[scrolling]
history = 10000

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[bell]
duration = 0

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
