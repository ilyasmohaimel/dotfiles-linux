conky.config = {
  alignment = 'top_right',
  background = false,
  default_color = 'FFFFFF',
  double_buffer = true,
  font = 'JetBrains Mono:size=10',
  gap_x = 46,
  gap_y = 58,
  minimum_width = 300,
  maximum_width = 300,
  no_buffers = true,
  out_to_wayland = true,
  own_window = true,
  own_window_argb_visual = true,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  own_window_transparent = true,
  own_window_type = 'dock',
  update_interval = 1,
  use_xft = true,
  xftalpha = 1,
  color1 = 'B0000A',
  color2 = 'FF5A1F',
  color3 = '25D9E8',
}

conky.text = [[
${font JetBrains Mono:size=30:style=Bold}${color1}${time %H:%M}${font}
${color2}${time %A · %d %B %Y}

${color1}${hr 2}
${font JetBrains Mono:size=11:style=Bold}${color2}SYSTEM${font}
${color}CPU     ${cpu cpu0}%  ${freq_g 0} GHz
TEMP    ${execi 5 sensors | awk '/Package id 0/ {gsub(/[+°C]/, "", $4); print $4 "°C"; exit}'}
MEMORY  ${memperc}%  ${mem}/${memmax}
SWAP    ${swapperc}%  ${swap}/${swapmax}
DISK    ${fs_used_perc /home}%  ${fs_used /home}/${fs_size /home}

${font JetBrains Mono:size=11:style=Bold}${color2}NVIDIA MX150${font}
${color}GPU     ${execi 5 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits}%
TEMP    ${execi 5 nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits}°C
VRAM    ${execi 5 nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader,nounits} MiB

${font JetBrains Mono:size=11:style=Bold}${color2}POWER${font}
${color}BATTERY ${battery_percent BAT0}%  ${battery_short BAT0}
NETWORK ${addr eno1}
${color3}UP      ${upspeed eno1}
${color3}DOWN    ${downspeed eno1}
]]
